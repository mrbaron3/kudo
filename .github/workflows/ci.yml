name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # KUDO_YAML_ORACLE=required は canonical YAML の差分オラクル（独立実装の YAML
      # parser）が見つからない場合に skip ではなく失敗させる。golden fixture は
      # 自作 encoder の変化検出器でしかないため、YAML としての正しさは CI で必ず検証する。
      - name: Test
        run: go test ./...
        env:
          KUDO_YAML_ORACLE: required

  # linux/amd64 と linux/arm64 の両方で image build と smoke test を行う
  container-image:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build runtime image
        run: docker build --file infra/Dockerfile --target runtime --tag kudo:ci .

      - name: Smoke test runtime image as non-root
        shell: bash
        run: |
          docker run --rm kudo:ci help
          docker run --rm kudo:ci version
          user="$(docker inspect --format '{{.Config.User}}' kudo:ci)"
          if [[ "$user" != "nonroot:nonroot" ]]; then
            echo "unexpected runtime user: $user"
            exit 1
          fi

      - name: Build dev image
        run: docker build --file infra/Dockerfile --target dev --tag kudo-dev:ci .

      - name: Smoke test CLI in dev image
        run: docker run --rm kudo-dev:ci kudo help

      - name: Run required checks inside dev image (no bind mount, no network dependency)
        run: docker run --rm --network=none kudo-dev:ci mise run check

  # Compose 基盤の検証: config、PostgreSQL healthcheck、container 内 check、integration test
  compose-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare non-secret environment file
        run: cp .env.example .env

      - name: Validate compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL and wait for healthcheck
        run: docker compose up --detach --wait postgres

      - name: Run required checks in the check service
        run: docker compose run --build --rm check

      - name: Run PostgreSQL integration tests
        run: docker compose run --rm integration

      - name: Tear down
        if: always()
        run: docker compose --profile check down --volumes
