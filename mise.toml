[tools]
go = "1.26.5"

[tasks.format]
description = "Format Go sources"
run = "gofmt -w ."

[tasks."format:check"]
description = "Check Go formatting"
run = '''
unformatted="$(gofmt -l .)"
if [ -n "$unformatted" ]; then
  printf '%s\n' "$unformatted"
  exit 1
fi
'''

[tasks.vet]
description = "Run static analysis"
run = "go vet ./..."

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks.check]
description = "Run all required checks"
depends = ["format:check", "vet", "test"]

[tasks."test:integration"]
description = "Run PostgreSQL integration tests (requires KUDO_TEST_DATABASE_URL)"
run = "go test -tags=integration -count=1 ./test/integration/..."

[tasks."test:github-live"]
description = "Run GitHub App installation token live smoke tests (requires actor *_FILE settings)"
run = "go test -tags=githublive -count=1 ./internal/adapter/github/... -run TestLiveGitHubAppInstallationTokens"

[tasks."compose:check"]
description = "Run `mise run check` inside the Compose dev container"
run = "docker compose run --build --rm check"

[tasks."compose:integration"]
description = "Run PostgreSQL integration tests inside the Compose dev container"
run = "docker compose run --build --rm integration"
