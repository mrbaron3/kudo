[tools]
go = "1.26.5"

[tasks.format]
description = "Format Go sources"
run = "gofmt -w ."

[tasks."format:check"]
description = "Check Go formatting"
run = '''
unformatted="$(gofmt -l .)"
if [ -n "$unformatted" ]; then
  printf '%s\n' "$unformatted"
  exit 1
fi
'''

[tasks.vet]
description = "Run static analysis"
run = "go vet ./..."

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks.check]
description = "Run all required checks"
depends = ["format:check", "vet", "test"]
